<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fundo dark indigo com cantos arredondados -->
  <rect width="512" height="512" rx="100" fill="#1e1b4b"/>
  <!-- capa esquerda / lombada -->
  <rect x="128" y="148" width="118" height="216" rx="10" fill="#3730a3"/>
  <!-- lombada -->
  <rect x="238" y="148" width="18" height="216" fill="#1e1650"/>
  <!-- capa direita -->
  <rect x="250" y="148" width="134" height="216" rx="10" fill="#4f46e5"/>
  <!-- linhas de texto na capa direita -->
  <rect x="274" y="194" width="84" height="9" rx="4.5" fill="#a5b4fc" opacity="0.85"/>
  <rect x="274" y="214" width="64" height="9" rx="4.5" fill="#a5b4fc" opacity="0.65"/>
  <rect x="274" y="234" width="74" height="9" rx="4.5" fill="#a5b4fc" opacity="0.65"/>
  <rect x="274" y="254" width="56" height="9" rx="4.5" fill="#a5b4fc" opacity="0.65"/>
  <rect x="274" y="274" width="70" height="9" rx="4.5" fill="#a5b4fc" opacity="0.65"/>
  <rect x="274" y="294" width="50" height="9" rx="4.5" fill="#a5b4fc" opacity="0.50"/>
  <!-- letras "LP" na capa esquerda -->
  <text x="187" y="284"
    font-family="Georgia,'Times New Roman',serif"
    font-size="80" font-weight="700"
    fill="#e0e7ff" text-anchor="middle"
    letter-spacing="-4">LP</text>
</svg>
